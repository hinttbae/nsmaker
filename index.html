<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>넨석 취향표 만들기</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
  href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap"
  rel="stylesheet"
>

<style>

  :root{
    --line:#c9c9c9;
    --ink:#000;
    --muted:#888;
  }

  *{
    box-sizing:border-box;
  }

  html,
  body{
    margin:0;
    padding:0;
  }

  body{
    background:#f2f2f2;
    color:#222;
    font-family:'Noto Sans KR', sans-serif;
    min-height:100vh;
  }

  .page{
    max-width:640px;
    margin:0 auto;
    padding:32px 16px 70px;
  }

  header{
    text-align:center;
    margin-bottom:22px;
  }

  h1{
    font-size:24px;
    font-weight:900;
    margin:0 0 4px;
    letter-spacing:-0.01em;
  }

  header p{
    margin:0;
    color:var(--muted);
    font-size:13px;
  }


  /* =========================================================
     표
     ========================================================= */

  #capture{
    background:#000;
    border:3px solid #000;
  }

  .capture-title{
    padding:16px 10px 14px;
    text-align:center;
  }

  .chart-title{
    font-size:22px;
    font-weight:900;
    color:#fff;
    outline:none;
  }

  .chart-handle{
    font-size:12px;
    color:rgba(255,255,255,0.65);
    outline:none;
    margin-top:2px;
  }

  [contenteditable]:focus{
    background:rgba(255,255,255,0.12);
  }


  /* =========================================================
     4 x 2 그리드
     ========================================================= */

  .op-grid{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:3px;
    background:#000;
  }

  .op-cell{
    background:#fff;
    display:flex;
    flex-direction:column;
  }

  .op-head{
    background:#000;
    color:#fff;
    font-size:12px;
    font-weight:700;
    text-align:center;
    padding:7px 2px;
    letter-spacing:0.01em;
    word-break:keep-all;
  }


  /* =========================================================
     사진

     화면에서는 cover로 표시
     다운로드할 때는 JS가 실제 크롭 이미지로 변환
     ========================================================= */

  .op-photo{
    aspect-ratio:1/1;
    background:#e9e9e9;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }

  .op-photo img{
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center center;
    display:block;
  }

  .op-photo .empty-label{
    font-size:11px;
    color:#aaa;
    text-align:center;
  }


  /* =========================================================
     캡션
     ========================================================= */

  .op-caption[contenteditable]{
    outline:none;
    cursor:text;
  }

  .op-caption[contenteditable]:empty::before{
    content:attr(data-placeholder);
    color:#bbb;
    font-weight:400;
  }

  .op-caption{
    background:#fff;
    color:#000;
    font-weight:700;
    font-size:12px;
    text-align:center;
    padding:6px 2px;
    border-top:2px solid #000;
    word-break:break-all;
  }

  .op-caption.placeholder{
    color:#bbb;
    font-weight:400;
  }


  /* =========================================================
     컨트롤 패널
     ========================================================= */

  .panel{
    margin-top:18px;
    border:1px solid var(--line);
    background:#fff;
  }

  .tabs{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    border-bottom:1px solid var(--line);
  }

  .tab-btn{
    width:100%;
    font-family:'Noto Sans KR', sans-serif;
    font-size:12px;
    font-weight:700;
    padding:10px 2px;
    border:none;
    border-right:1px solid var(--line);
    border-bottom:1px solid var(--line);
    background:#fff;
    color:#666;
    cursor:pointer;
    text-align:center;
  }

  .tab-btn:nth-child(4n){
    border-right:none;
  }

  .tab-btn:nth-child(n+5){
    border-bottom:none;
  }

  .tab-btn:hover{
    background:#f5f5f5;
  }

  .tab-btn.active{
    background:#000;
    color:#fff;
  }

  .options-body{
    padding:12px;
  }

  .options-row{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }


  /* =========================================================
     옵션 칩
     ========================================================= */

  .opt-chip{
    position:relative;
    display:flex;
    align-items:center;
    gap:6px;
    border:1px solid var(--line);
    padding:6px 10px 6px 6px;
    cursor:pointer;
    background:#fff;
    font-size:12px;
    color:#222;
  }

  .opt-chip:hover{
    border-color:#999;
  }

  .opt-chip.selected{
    border-color:#000;
    background:#f2f2f2;
    font-weight:700;
  }

  .opt-chip .mini-thumb{
    width:26px;
    height:26px;
    background:#eee;
    border:1px solid var(--line);
    overflow:hidden;
    flex:0 0 auto;
  }

  .opt-chip .mini-thumb img{
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center center;
    display:block;
  }

  .opt-chip .pin-btn{
    border:none;
    background:none;
    cursor:pointer;
    font-size:12px;
    color:#999;
    padding:0 0 0 2px;
    line-height:1;
  }

  .opt-chip .pin-btn:hover{
    color:#000;
  }

  .opt-chip.custom{
    border-style:dashed;
  }


  /* =========================================================
     버튼
     ========================================================= */

  .actions{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-top:18px;
  }

  .action-btn{
    font-family:'Noto Sans KR', sans-serif;
    font-size:13px;
    font-weight:700;
    padding:10px 20px;
    border-radius:2px;
    border:1px solid #000;
    cursor:pointer;
  }

  .action-btn.primary{
    background:#000;
    color:#fff;
  }

  .action-btn.ghost{
    background:#fff;
    color:#000;
  }

  .action-btn:hover{
    opacity:0.85;
  }


  /* =========================================================
     안내
     ========================================================= */

  .hint{
    margin-top:14px;
    font-size:12px;
    color:var(--muted);
    line-height:1.6;
    border-top:1px dashed var(--line);
    padding-top:12px;
  }


  /* =========================================================
     토스트
     ========================================================= */

  .toast{
    position:fixed;
    left:50%;
    bottom:26px;
    transform:translateX(-50%) translateY(20px);
    background:#000;
    color:#fff;
    padding:10px 18px;
    font-size:13px;
    opacity:0;
    pointer-events:none;
    transition:all .2s ease;
    z-index:99999;
    max-width:90%;
    text-align:center;
  }

  .toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }


  /* =========================================================
     모바일
     ========================================================= */

  @media (max-width:480px){

    .op-head{
      font-size:10px;
      padding:5px 1px;
    }

    .op-caption{
      font-size:11px;
    }

    .tab-btn{
      font-size:11px;
      padding:8px 1px;
    }

  }

</style>
</head>


<body>

<div class="page">

  <header>

    <h1>❤️넨석 취향표 만들기❤️</h1>

    <p>
      항목별 보기를 선택해 표를 완성하고,
      이미지로 저장해보세요.
    </p>

  </header>


  <!-- =======================================================
       캡처 영역
       ======================================================= -->

  <div id="capture">

    <div class="capture-title">

      <div
        class="chart-title"
        contenteditable="true"
        spellcheck="false"
      >❤️넨석 취향표❤️</div>

      <div
        class="chart-handle"
        contenteditable="true"
        spellcheck="false"
      >@닉네임</div>

    </div>

    <div
      class="op-grid"
      id="opGrid"
    ></div>

  </div>


  <!-- =======================================================
       선택 패널
       ======================================================= -->

  <div class="panel">

    <div
      class="tabs"
      id="tabs"
    ></div>

    <div
      class="options-body"
      id="optionsBody"
    ></div>

  </div>


  <!-- 파일 입력 -->

  <input
    type="file"
    id="fileInputCustom"
    accept="image/*"
    style="display:none"
  >

  <input
    type="file"
    id="fileInputPin"
    accept="image/*"
    style="display:none"
  >


  <!-- 버튼 -->

  <div class="actions">

    <button
      class="action-btn primary"
      id="saveBtn"
    >
      이미지로 저장
    </button>

    <button
      class="action-btn ghost"
      id="resetBtn"
    >
      초기화
    </button>

  </div>


  <div class="hint">

    📌 오류 및 수정 문의는
    spin-spin.com/kkamgotheleft 로 보내주세요.<br>

    📌 보기에 없는 답을 쓰고 싶다면
    각 항목의 [그 외] 칩을 눌러 직접 사진을 올리면 됩니다.

  </div>

</div>


<div
  class="toast"
  id="toast"
></div>


<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>


<script>
(function(){


  /* =========================================================
     기본 이미지
     ========================================================= */

  const DEFAULT_IMAGE =
    'https://i.imgur.com/XEwY6gC.png';


  /* =========================================================
     카테고리
     ========================================================= */

  const CATEGORIES = [

    {
      key:'choiae',
      name:'최애',

      options:[

        {
          id:'1',
          label:'원빈',

        },

        {
          id:'2',
          label:'은석',
          img:'https://i.imgur.com/dlVur67.jpeg'
        }

      ]
    },


    {
      key:'ddeokbap',
      name:'최애 떡밥',

      options:[

        {
          id:'1',
          label:'비게퍼',
          img:'https://i.imgur.com/I4RXCjq.jpeg'
        },

        {
          id:'2',
          label:'스페셜커플',
          img:'https://i.imgur.com/ElUNqI0.jpeg'
        },

        {
          id:'3',
          label:'원석발견',
          img:'https://i.imgur.com/jERGkpu.jpeg'
        },

        {
          id:'4',
          label:'아육대',
          img:'https://i.imgur.com/YyQXJVs.jpeg'
        },

        {
          id:'5',
          label:'여름방학',
          img:'https://i.imgur.com/vhZ460J.jpeg'
        }

      ]
    },


    {
      key:'ipdeok',
      name:'입덕 계기',
      options:[]
    },


    {
      key:'reels',
      name:'릴스',

      options:[

        {
          id:'1',
          label:'Cooking with',
          img:'https://i.imgur.com/0DmTYa5.jpeg'
        },

        {
          id:'2',
          label:'보핍보핍',
          img:'https://i.imgur.com/mVwKXnh.jpeg'
        },

        {
          id:'3',
          label:'all of you',
          img:'https://i.imgur.com/H6vxVMd.jpeg'
        },

        {
          id:'4',
          label:'look alike',
          img:'https://i.imgur.com/pSAAItT.jpeg'
        },

        {
          id:'5',
          label:'소다팝',
          img:'https://i.imgur.com/7f4nNbN.jpeg'
        },

        {
          id:'6',
          label:'닉주디',
          img:'https://i.imgur.com/Jhw7pxl.jpeg'
        }

      ]
    },


    {
      key:'core',
      name:'코어',

      options:[

        {
          id:'1',
          label:'동거',
          img:'https://i.imgur.com/J81AhAc.jpeg'
        },

        {
          id:'2',
          label:'형형동동',
          img:'https://i.imgur.com/OBXFO8M.jpeg'
        },

        {
          id:'3',
          label:'쌍방얼빠',
          img:'https://i.imgur.com/AAgX0l1.jpeg'
        },

        {
          id:'4',
          label:'캬옹캬옹',
          img:'https://i.imgur.com/lM0w4Ou.jpeg'
        },

        {
          id:'5',
          label:'카피캣',
          img:'https://i.imgur.com/kDSi3O4.jpeg'
        },

        {
          id:'6',
          label:'애교 알러지',
          img:'https://i.imgur.com/RgtU7UA.png'
        }

      ]
    },


    {
      key:'pair',
      name:'조합명',

      options:[

        {
          id:'1',
          label:'울산바위',
          img:'https://i.imgur.com/Wt8UFpL.jpeg'
        },

        {
          id:'2',
          label:'석과비니',
          img:'https://i.imgur.com/DmQKMRM.jpeg'
        },

        {
          id:'3',
          label:'왕자님즈',
          img:'https://i.imgur.com/wdgf2a8.jpeg'
        },

        {
          id:'4',
          label:'모지리즈',
          img:'https://i.imgur.com/5dqOQwK.jpeg'
        },

        {
          id:'5',
          label:'고양이 형제',
          img:'https://i.imgur.com/ElxrbZk.jpeg'
        }

      ]
    },


    {
      key:'moehwa',
      name:'모에화',
      options:[]
    },


    {
      key:'pota',
      name:'최애 포타',
      options:[]
    }

  ];


  /* =========================================================
     상태
     ========================================================= */

  let currentCategoryIndex = 0;

  const selections = {};

  const customPins = {};

  let targetPinInfo = null;


  /* =========================================================
     기본 이미지
     ========================================================= */

  function getDefaultImageHTML(){

    return `
      <img
        src="${DEFAULT_IMAGE}"
        alt="선택 없음"
        crossorigin="anonymous"
      >
    `;

  }


  /* =========================================================
     토스트
     ========================================================= */

  function showToast(text){

    const t =
      document.getElementById('toast');

    t.textContent = text;

    t.classList.add('show');

    setTimeout(
      () => t.classList.remove('show'),
      2500
    );

  }


  /* =========================================================
     그리드 생성
     ========================================================= */

  function initGrid(){

    const grid =
      document.getElementById('opGrid');

    grid.innerHTML = '';


    CATEGORIES.forEach(cat => {

      const cell =
        document.createElement('div');

      cell.className = 'op-cell';

      cell.dataset.key =
        cat.key;


      const head =
        document.createElement('div');

      head.className =
        'op-head';

      head.textContent =
        cat.name;


      const photo =
        document.createElement('div');

      photo.className =
        'op-photo';

      photo.id =
        `photo-${cat.key}`;


      /* 기본 이미지 */

      photo.innerHTML =
        getDefaultImageHTML();


      const caption =
        document.createElement('div');

      caption.className =
        'op-caption placeholder';

      caption.id =
        `caption-${cat.key}`;

      caption.contentEditable =
        true;

      caption.setAttribute(
        'spellcheck',
        'false'
      );

      caption.setAttribute(
        'data-placeholder',
        '직접 입력'
      );


      cell.appendChild(head);

      cell.appendChild(photo);

      cell.appendChild(caption);

      grid.appendChild(cell);

    });

  }


  /* =========================================================
     탭
     ========================================================= */

  function initTabs(){

    const tabsContainer =
      document.getElementById('tabs');

    tabsContainer.innerHTML = '';


    CATEGORIES.forEach(
      (cat, idx) => {

        const btn =
          document.createElement('button');

        btn.className =
          `tab-btn ${
            idx === currentCategoryIndex
              ? 'active'
              : ''
          }`;

        btn.textContent =
          cat.name;


        btn.onclick = () => {

          currentCategoryIndex =
            idx;

          renderTabs();

          renderOptions();

        };


        tabsContainer.appendChild(
          btn
        );

      }
    );

  }


  function renderTabs(){

    const btns =
      document.querySelectorAll(
        '.tab-btn'
      );


    btns.forEach(
      (btn, idx) => {

        if(
          idx ===
          currentCategoryIndex
        ){

          btn.classList.add(
            'active'
          );

        }
        else{

          btn.classList.remove(
            'active'
          );

        }

      }
    );

  }


  /* =========================================================
     옵션
     ========================================================= */

  function renderOptions(){

    const body =
      document.getElementById(
        'optionsBody'
      );

    body.innerHTML = '';


    const cat =
      CATEGORIES[
        currentCategoryIndex
      ];


    const row =
      document.createElement('div');

    row.className =
      'options-row';


    cat.options.forEach(
      opt => {

        const chip =
          document.createElement('div');


        const isSelected =
          selections[cat.key] &&
          selections[cat.key].id ===
            opt.id;


        chip.className =
          `opt-chip ${
            isSelected
              ? 'selected'
              : ''
          }`;


        const pinKey =
          `${cat.key}_${opt.id}`;


        const displayImg =
          customPins[pinKey] ||
          opt.img;


        let thumbHtml = '';


        if(displayImg){

          thumbHtml = `

            <div class="mini-thumb">

              <img
                src="${displayImg}"
                crossorigin="anonymous"
              >

            </div>

          `;

        }


        chip.innerHTML = `

          ${thumbHtml}

          <span>
            ${opt.label}
          </span>

          <button
            class="pin-btn"
            title="고정 사진 설정"
          >
            📷
          </button>

        `;


        chip.onclick = (e) => {

          if(
            e.target.classList.contains(
              'pin-btn'
            )
          ){

            return;

          }


          selectOption(
            cat.key,
            opt.id,
            opt.label,
            displayImg
          );

        };


        const pinBtn =
          chip.querySelector(
            '.pin-btn'
          );


        pinBtn.onclick = (e) => {

          e.stopPropagation();


          targetPinInfo = {

            catKey:
              cat.key,

            optId:
              opt.id

          };


          document
            .getElementById(
              'fileInputPin'
            )
            .click();

        };


        row.appendChild(
          chip
        );

      }
    );


    /* 그 외 */

    const customChip =
      document.createElement('div');


    const isCustomSelected =
      selections[cat.key] &&
      selections[cat.key].id ===
        'custom';


    customChip.className =
      `opt-chip custom ${
        isCustomSelected
          ? 'selected'
          : ''
      }`;


    customChip.innerHTML =
      `<span>➕ 그 외 (직접 업로드)</span>`;


    customChip.onclick = () => {

      document
        .getElementById(
          'fileInputCustom'
        )
        .click();

    };


    row.appendChild(
      customChip
    );


    body.appendChild(
      row
    );

  }


  /* =========================================================
     선택
     ========================================================= */

  function selectOption(
    catKey,
    id,
    label,
    imgSrc
  ){

    selections[catKey] = {

      id:id,

      label:label,

      img:imgSrc

    };


    const photoEl =
      document.getElementById(
        `photo-${catKey}`
      );


    const captionEl =
      document.getElementById(
        `caption-${catKey}`
      );


    if(imgSrc){

      photoEl.innerHTML = `

        <img
          src="${imgSrc}"
          alt="${label}"
          crossorigin="anonymous"
        >

      `;

    }
    else{

      photoEl.innerHTML =
        getDefaultImageHTML();

    }


    if(label){

      captionEl.textContent =
        label;

      captionEl.classList.remove(
        'placeholder'
      );

    }


    renderOptions();

  }


  /* =========================================================
     직접 업로드
     ========================================================= */

  document
    .getElementById(
      'fileInputCustom'
    )
    .onchange =
    function(e){

      const file =
        e.target.files[0];


      if(!file){

        return;

      }


      const reader =
        new FileReader();


      reader.onload =
        function(evt){

          const cat =
            CATEGORIES[
              currentCategoryIndex
            ];


          selectOption(

            cat.key,

            'custom',

            '직접 입력',

            evt.target.result

          );

        };


      reader.readAsDataURL(file);

      e.target.value = '';

    };


  /* =========================================================
     고정 사진 업로드
     ========================================================= */

  document
    .getElementById(
      'fileInputPin'
    )
    .onchange =
    function(e){

      const file =
        e.target.files[0];


      if(
        !file ||
        !targetPinInfo
      ){

        return;

      }


      const reader =
        new FileReader();


      reader.onload =
        function(evt){

          const pinKey =
            `${targetPinInfo.catKey}_${targetPinInfo.optId}`;


          customPins[pinKey] =
            evt.target.result;


          const currentSel =
            selections[
              targetPinInfo.catKey
            ];


          if(
            currentSel &&
            currentSel.id ===
              targetPinInfo.optId
          ){

            selectOption(

              targetPinInfo.catKey,

              targetPinInfo.optId,

              currentSel.label,

              evt.target.result

            );

          }
          else{

            renderOptions();

          }


          showToast(
            '고정 사진이 지정되었습니다.'
          );

        };


      reader.readAsDataURL(file);

      e.target.value = '';

    };


  /* =========================================================
     ★ 핵심 ★
     실제 사진을 비율 유지 상태로 크롭해서
     새로운 정사각형 이미지로 만드는 함수

     화면의 object-fit:cover와 동일한 결과를
     실제 픽셀로 만들어준다.
     ========================================================= */

  function createCroppedImage(
    img,
    targetWidth,
    targetHeight
  ){

    return new Promise(
      (resolve, reject) => {

        const source =
          new Image();


        source.crossOrigin =
          'anonymous';


        source.onload =
          function(){

            try{

              const sw =
                source.naturalWidth ||
                source.width;


              const sh =
                source.naturalHeight ||
                source.height;


              if(
                !sw ||
                !sh
              ){

                reject(
                  new Error(
                    '이미지 크기를 확인할 수 없습니다.'
                  )
                );

                return;

              }


              /*
                cover 계산

                원본 비율:
                sw / sh

                목표 비율:
                targetWidth / targetHeight
              */


              const sourceRatio =
                sw / sh;


              const targetRatio =
                targetWidth /
                targetHeight;


              let cropWidth =
                sw;

              let cropHeight =
                sh;


              let sourceX = 0;

              let sourceY = 0;


              if(
                sourceRatio >
                targetRatio
              ){

                /*
                  원본이 더 가로로 김

                  좌우를 잘라냄
                */

                cropWidth =
                  sh *
                  targetRatio;

                sourceX =
                  (sw -
                    cropWidth) /
                  2;

              }
              else{

                /*
                  원본이 더 세로로 김

                  위아래를 잘라냄
                */

                cropHeight =
                  sw /
                  targetRatio;

                sourceY =
                  (sh -
                    cropHeight) /
                  2;

              }


              const canvas =
                document.createElement(
                  'canvas'
                );


              /*
                충분히 큰 정사각형으로
                만들어서 화질 손실을 줄임
              */

              const outputSize =
                Math.max(
                  1000,
                  targetWidth,
                  targetHeight
                );


              canvas.width =
                outputSize;

              canvas.height =
                outputSize;


              const ctx =
                canvas.getContext(
                  '2d'
                );


              ctx.drawImage(

                source,

                sourceX,
                sourceY,
                cropWidth,
                cropHeight,

                0,
                0,
                outputSize,
                outputSize

              );


              resolve(
                canvas.toDataURL(
                  'image/png',
                  1
                )
              );

            }
            catch(error){

              reject(error);

            }

          };


        source.onerror =
          function(){

            reject(
              new Error(
                '이미지를 불러오지 못했습니다.'
              )
            );

          };


        source.src =
          img.currentSrc ||
          img.src;

      }
    );

  }


  /* =========================================================
     ★ 다운로드용 크롭 처리

     현재 화면의 사진을 잠시 실제 크롭 이미지로 바꾼다.
     html2canvas가 이 이미지를 그대로 캡처한다.
     캡처가 끝나면 원래 이미지로 되돌린다.
     ========================================================= */

  async function prepareImagesForCapture(){

    const images =
      Array.from(
        document.querySelectorAll(
          '#capture .op-photo img'
        )
      );


    const restoreList = [];


    for(
      const img of images
    ){

      /*
        이미지가 아직 로딩 중이면 기다림
      */

      if(
        !img.complete
      ){

        await new Promise(
          resolve => {

            img.onload =
              resolve;

            img.onerror =
              resolve;

          }
        );

      }


      const photoBox =
        img.closest(
          '.op-photo'
        );


      if(!photoBox){

        continue;

      }


      const rect =
        photoBox.getBoundingClientRect();


      /*
        CSS 픽셀 크기보다 크게 만들어
        다운로드 이미지의 화질을 확보
      */

      const width =
        Math.max(
          1000,
          Math.round(
            rect.width * 2
          )
        );


      const height =
        Math.max(
          1000,
          Math.round(
            rect.height * 2
          )
        );


      const originalSrc =
        img.getAttribute(
          'src'
        );


      const originalSrcset =
        img.getAttribute(
          'srcset'
        );


      try{

        const croppedSrc =
          await createCroppedImage(
            img,
            width,
            height
          );


        restoreList.push({

          img:img,

          src:originalSrc,

          srcset:originalSrcset

        });


        /*
          html2canvas가 이제
          object-fit을 해석할 필요 없이
          이미 완성된 정사각형 이미지를 캡처함
        */

        img.removeAttribute(
          'srcset'
        );

        img.src =
          croppedSrc;

        img.style.objectFit =
          'fill';

        img.style.width =
          '100%';

        img.style.height =
          '100%';

      }
      catch(error){

        console.warn(
          '사진 크롭 실패:',
          error
        );

      }

    }


    return function restoreImages(){

      restoreList.forEach(
        item => {

          if(
            item.srcset !== null
          ){

            item.img.setAttribute(
              'srcset',
              item.srcset
            );

          }
          else{

            item.img.removeAttribute(
              'srcset'
            );

          }


          item.img.src =
            item.src;


          item.img.style.objectFit =
            '';

          item.img.style.width =
            '';

          item.img.style.height =
            '';

        }
      );

    };

  }


  /* =========================================================
     canvas → Blob
     ========================================================= */

  function canvasToBlob(
    canvas
  ){

    return new Promise(
      (resolve, reject) => {

        canvas.toBlob(
          blob => {

            if(blob){

              resolve(blob);

            }
            else{

              reject(
                new Error(
                  'PNG 생성 실패'
                )
              );

            }

          },

          'image/png',

          1.0
        );

      }
    );

  }


  /* =========================================================
     ★ 이미지 저장
     ========================================================= */

  document
    .getElementById(
      'saveBtn'
    )
    .onclick =
    async function(){

      const saveBtn =
        document.getElementById(
          'saveBtn'
        );


      if(
        saveBtn.dataset.saving ===
        'true'
      ){

        return;

      }


      saveBtn.dataset.saving =
        'true';

      saveBtn.disabled =
        true;

      saveBtn.textContent =
        '이미지 생성 중...';


      let restoreImages =
        null;


      try{

        const captureEl =
          document.getElementById(
            'capture'
          );


        /*
          -----------------------------------------------------
          1. 사진을 실제 크롭 이미지로 변경
          -----------------------------------------------------
        */

        restoreImages =
          await prepareImagesForCapture();


        /*
          -----------------------------------------------------
          2. html2canvas 캡처
          -----------------------------------------------------
        */

        const canvas =
          await html2canvas(
            captureEl,
            {

              scale:2,

              useCORS:true,

              allowTaint:false,

              backgroundColor:'#000',

              imageTimeout:15000,

              logging:false

            }
          );


        /*
          -----------------------------------------------------
          3. 캡처가 끝났으므로
             화면 이미지를 원래대로 복구
          -----------------------------------------------------
        */

        if(
          restoreImages
        ){

          restoreImages();

          restoreImages =
            null;

        }


        /*
          -----------------------------------------------------
          4. PNG Blob 생성
          -----------------------------------------------------
        */

        const blob =
          await canvasToBlob(
            canvas
          );


        const fileName =
          '넨석_취향표.png';


        /*
          -----------------------------------------------------
          5. 모바일 공유 기능

          iPhone/iPad 등에서는
          공유 메뉴를 이용해 사진 앱에 저장 가능
          -----------------------------------------------------
        */

        if(
          navigator.share &&
          typeof File !==
            'undefined'
        ){

          try{

            const file =
              new File(
                [blob],
                fileName,
                {
                  type:'image/png'
                }
              );


            let canShare =
              false;


            if(
              navigator.canShare
            ){

              try{

                canShare =
                  navigator.canShare({
                    files:[file]
                  });

              }
              catch(e){

                canShare =
                  false;

              }

            }


            if(canShare){

              await navigator.share({

                files:[file],

                title:
                  '넨석 취향표',

                text:
                  '넨석 취향표 이미지'

              });


              showToast(
                '이미지 저장/공유 메뉴를 완료했습니다.'
              );


              return;

            }

          }
          catch(shareError){

            /*
              사용자가 공유창을 닫은 경우
            */

            if(
              shareError &&
              shareError.name ===
                'AbortError'
            ){

              return;

            }

            console.log(
              '공유 저장 실패:',
              shareError
            );

          }

        }


        /*
          -----------------------------------------------------
          6. PC / Android 다운로드
          -----------------------------------------------------
        */

        const blobUrl =
          URL.createObjectURL(
            blob
          );


        const link =
          document.createElement(
            'a'
          );


        link.href =
          blobUrl;

        link.download =
          fileName;

        link.style.display =
          'none';


        document.body.appendChild(
          link
        );


        link.click();


        setTimeout(
          () => {

            URL.revokeObjectURL(
              blobUrl
            );

            link.remove();

          },
          10000
        );


        showToast(
          '이미지 저장을 시작했습니다.'
        );

      }
      catch(error){

        console.error(
          '이미지 저장 오류:',
          error
        );


        /*
          오류가 나더라도
          화면의 원본 이미지는 반드시 복구
        */

        if(
          restoreImages
        ){

          try{

            restoreImages();

          }
          catch(e){

            console.error(e);

          }

        }


        showToast(
          '이미지 저장에 실패했습니다. 다시 시도해주세요.'
        );

      }
      finally{

        saveBtn.dataset.saving =
          'false';

        saveBtn.disabled =
          false;

        saveBtn.textContent =
          '이미지로 저장';

      }

    };


  /* =========================================================
     초기화
     ========================================================= */

  document
    .getElementById(
      'resetBtn'
    )
    .onclick =
    function(){

      if(
        !confirm(
          '작성 내용을 초기화하시겠습니까?'
        )
      ){

        return;

      }


      CATEGORIES.forEach(
        cat => {

          delete selections[
            cat.key
          ];


          const photoEl =
            document.getElementById(
              `photo-${cat.key}`
            );


          const captionEl =
            document.getElementById(
              `caption-${cat.key}`
            );


          /*
            초기화하면
            기본 이미지로 돌아감
          */

          photoEl.innerHTML =
            getDefaultImageHTML();


          captionEl.textContent =
            '';


          captionEl.classList.add(
            'placeholder'
          );

        }
      );


      renderOptions();


      showToast(
        '초기화되었습니다.'
      );

    };


  /* =========================================================
     실행
     ========================================================= */

  initGrid();

  initTabs();

  renderOptions();

})();
</script>
