<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>넨석 취향표 만들기</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">

<style>

  :root{
    --line:#c9c9c9;
    --ink:#000;
    --muted:#888;
  }

  *{
    box-sizing:border-box;
  }

  html,
  body{
    margin:0;
    padding:0;
  }

  body{
    background:#f2f2f2;
    color:#222;
    font-family:'Noto Sans KR', sans-serif;
    min-height:100vh;
  }

  .page{
    max-width:640px;
    margin:0 auto;
    padding:32px 16px 70px;
  }

  header{
    text-align:center;
    margin-bottom:22px;
  }

  h1{
    font-size:24px;
    font-weight:900;
    margin:0 0 4px;
    letter-spacing:-0.01em;
  }

  header p{
    margin:0;
    color:var(--muted);
    font-size:13px;
  }


  /* =========================================================
     표
     ========================================================= */

  #capture{
    background:#000;
    border:3px solid #000;
  }

  .capture-title{
    padding:16px 10px 14px;
    text-align:center;
  }

  .chart-title{
    font-size:22px;
    font-weight:900;
    color:#fff;
    outline:none;
  }

  .chart-handle{
    font-size:12px;
    color:rgba(255,255,255,0.65);
    outline:none;
    margin-top:2px;
  }

  [contenteditable]:focus{
    background:rgba(255,255,255,0.12);
  }


  /* =========================================================
     4 x 2 그리드
     ========================================================= */

  .op-grid{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:3px;
    background:#000;
  }

  .op-cell{
    background:#fff;
    display:flex;
    flex-direction:column;
    min-width:0;
  }

  .op-head{
    background:#000;
    color:#fff;
    font-size:12px;
    font-weight:700;
    text-align:center;
    padding:7px 2px;
    letter-spacing:0.01em;
    word-break:keep-all;
  }


  /* =========================================================
     사진 영역

     화면에서는 object-fit:cover 사용
     → 원본 비율 유지
     → 넘치는 부분만 크롭
     ========================================================= */

  .op-photo{
    aspect-ratio:1/1;
    background:#e9e9e9;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    min-width:0;
  }

  .op-photo img{
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center center;
    display:block;

    /*
      브라우저가 이미지 사이에
      미세한 렌더링 틈을 만드는 것을 방지
    */
    vertical-align:top;
  }

  .op-photo .empty-label{
    font-size:11px;
    color:#aaa;
    text-align:center;
  }


  /* =========================================================
     캡션
     ========================================================= */

  .op-caption[contenteditable]{
    outline:none;
    cursor:text;
  }

  .op-caption[contenteditable]:empty::before{
    content:attr(data-placeholder);
    color:#bbb;
    font-weight:400;
  }

  .op-caption{
    background:#fff;
    color:#000;
    font-weight:700;
    font-size:12px;
    text-align:center;
    padding:6px 2px;
    border-top:2px solid #000;
    word-break:break-all;
  }

  .op-caption.placeholder{
    color:#bbb;
    font-weight:400;
  }


  /* =========================================================
     컨트롤 패널
     ========================================================= */

  .panel{
    margin-top:18px;
    border:1px solid var(--line);
    background:#fff;
  }

  .tabs{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    border-bottom:1px solid var(--line);
  }

  .tab-btn{
    width:100%;
    font-family:'Noto Sans KR', sans-serif;
    font-size:12px;
    font-weight:700;
    padding:10px 2px;
    border:none;
    border-right:1px solid var(--line);
    border-bottom:1px solid var(--line);
    background:#fff;
    color:#666;
    cursor:pointer;
    text-align:center;
  }

  .tab-btn:nth-child(4n){
    border-right:none;
  }

  .tab-btn:nth-child(n+5){
    border-bottom:none;
  }

  .tab-btn:hover{
    background:#f5f5f5;
  }

  .tab-btn.active{
    background:var(--ink);
    color:#fff;
  }

  .options-body{
    padding:12px;
  }

  .options-row{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }


  /* =========================================================
     옵션 칩
     ========================================================= */

  .opt-chip{
    position:relative;
    display:flex;
    align-items:center;
    gap:6px;
    border:1px solid var(--line);
    padding:6px 10px 6px 6px;
    cursor:pointer;
    background:#fff;
    font-size:12px;
    color:#222;
  }

  .opt-chip:hover{
    border-color:#999;
  }

  .opt-chip.selected{
    border-color:var(--ink);
    background:#f2f2f2;
    font-weight:700;
  }

  .opt-chip .mini-thumb{
    width:26px;
    height:26px;
    background:#eee;
    border:1px solid var(--line);
    overflow:hidden;
    flex:0 0 auto;
  }

  .opt-chip .mini-thumb img{
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center center;
    display:block;
  }

  .opt-chip .pin-btn{
    border:none;
    background:none;
    cursor:pointer;
    font-size:12px;
    color:#999;
    padding:0 0 0 2px;
    line-height:1;
  }

  .opt-chip .pin-btn:hover{
    color:#000;
  }

  .opt-chip.custom{
    border-style:dashed;
  }


  /* =========================================================
     버튼
     ========================================================= */

  .actions{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-top:18px;
  }

  .action-btn{
    font-family:'Noto Sans KR', sans-serif;
    font-size:13px;
    font-weight:700;
    padding:10px 20px;
    border-radius:2px;
    border:1px solid #000;
    cursor:pointer;
  }

  .action-btn.primary{
    background:#000;
    color:#fff;
  }

  .action-btn.ghost{
    background:#fff;
    color:#000;
  }

  .action-btn:hover{
    opacity:0.85;
  }

  .action-btn:disabled{
    cursor:wait;
    opacity:0.65;
  }


  /* =========================================================
     안내 문구
     ========================================================= */

  .hint{
    margin-top:14px;
    font-size:12px;
    color:var(--muted);
    line-height:1.6;
    border-top:1px dashed var(--line);
    padding-top:12px;
  }


  /* =========================================================
     토스트
     ========================================================= */

  .toast{
    position:fixed;
    left:50%;
    bottom:26px;
    transform:translateX(-50%) translateY(20px);
    background:#000;
    color:#fff;
    padding:10px 18px;
    font-size:13px;
    opacity:0;
    pointer-events:none;
    transition:all .2s ease;
    z-index:9999;
    max-width:90%;
    text-align:center;
  }

  .toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }


  /* =========================================================
     모바일
     ========================================================= */

  @media (max-width:480px){

    .op-head{
      font-size:10px;
      padding:5px 1px;
    }

    .op-caption{
      font-size:11px;
    }

    .tab-btn{
      font-size:11px;
      padding:8px 1px;
    }

    .actions{
      flex-direction:row;
    }

    .action-btn{
      padding:10px 16px;
    }

  }

</style>
</head>


<body>

<div class="page">

  <header>

    <h1>❤️넨석 취향표 만들기❤️</h1>

    <p>
      항목별 보기를 선택해 표를 완성하고,
      이미지로 저장해보세요.
    </p>

  </header>


  <!-- =======================================================
       캡처 영역
       ======================================================= -->

  <div id="capture">

    <div class="capture-title">

      <div
        class="chart-title"
        contenteditable="true"
        spellcheck="false"
      >❤️넨석 취향표❤️</div>

      <div
        class="chart-handle"
        contenteditable="true"
        spellcheck="false"
      >@닉네임</div>

    </div>


    <div
      class="op-grid"
      id="opGrid"
    ></div>

  </div>


  <!-- =======================================================
       컨트롤 패널
       ======================================================= -->

  <div class="panel">

    <div
      class="tabs"
      id="tabs"
    ></div>

    <div
      class="options-body"
      id="optionsBody"
    ></div>

  </div>


  <!-- 파일 업로드 -->

  <input
    type="file"
    id="fileInputCustom"
    accept="image/*"
    style="display:none"
  >

  <input
    type="file"
    id="fileInputPin"
    accept="image/*"
    style="display:none"
  >


  <!-- 버튼 -->

  <div class="actions">

    <button
      class="action-btn primary"
      id="saveBtn"
    >
      이미지로 저장
    </button>

    <button
      class="action-btn ghost"
      id="resetBtn"
    >
      초기화
    </button>

  </div>


  <div class="hint">

    📌 오류 및 수정 문의는 spin-spin.com/kkamgotheleft 로 보내주세요.<br>

    📌 보기에 없는 답을 쓰고 싶다면 각 항목의 [그 외] 칩을 눌러 직접 사진을 올리면 됩니다.<br>

    📌 사진 옆 카메라 표시를 누르면 원하는 사진으로 바꿀 수 있어요.

  </div>

</div>


<div
  class="toast"
  id="toast"
></div>


<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>


<script>
(function(){


  /* =========================================================
     기본 이미지
     ========================================================= */

  const DEFAULT_IMAGE =
    'https://i.imgur.com/XEwY6gC.png';


  /* =========================================================
     저장 화질 설정

     3 = 고화질
     기존 2보다 저장 이미지가 선명합니다.
     ========================================================= */

  const EXPORT_SCALE = 3;


  /* =========================================================
     카테고리
     ========================================================= */

  const CATEGORIES = [

    {
      key:'choiae',
      name:'최애',

      options:[

        {
          id:'1',
          label:'원빈',

        },

        {

        }

      ]
    },


    {

      options:[

        {
          id:'1',
          label:'비게퍼',

        },

        {
          id:'2',

        },

        {

        },

        {
          id:'4',
          label:'아육대',

        },

        {
          id:'5',
          label:'여름방학',
          img:'https://i.imgur.com/vhZ460J.jpeg'
        }

      ]
    },


    {
      key:'ipdeok',
      name:'입덕 계기',
      options:[]
    },


    {
      key:'reels',
      name:'릴스',

      options:[

        {
          id:'1',
          label:'Cooking with',
          img:'https://i.imgur.com/0DmTYa5.jpeg'
        },

        {
          id:'2',
          label:'보핍보핍',
          img:'https://i.imgur.com/mVwKXnh.jpeg'
        },

        {
          id:'3',
          label:'all of you',
          img:'https://i.imgur.com/H6vxVMd.jpeg'
        },

        {
          id:'4',
          label:'look alike',

        },

        {
          id:'5',
          label:'소다팝',
          img:'https://i.imgur.com/7f4nNbN.jpeg'
        },

        {
          id:'6',

          img:'https://i.imgur.com/Jhw7pxl.jpeg'
        }

      ]
    },


    {
      key:'core',
      name:'코어',

      options:[

        {
          id:'1',
          label:'동거',
          img:'https://i.imgur.com/J81AhAc.jpeg'
        },

        {
          id:'2',
          label:'형형동동',
          img:'https://i.imgur.com/OBXFO8M.jpeg'
        },

        {
          id:'3',
          label:'쌍방얼빠',
          img:'https://i.imgur.com/AAgX0l1.jpeg'
        },

        {
          id:'4',
          label:'캬옹캬옹',
          img:'https://i.imgur.com/lM0w4Ou.jpeg'
        },

        {
          id:'5',
          label:'카피캣',
          img:'https://i.imgur.com/kDSi3O4.jpeg'
        },

        {
          id:'6',
          label:'애교 알러지',
          img:'https://i.imgur.com/RgtU7UA.png'
        }

      ]
    },


    {
      key:'pair',
      name:'조합명',

      options:[

        {
          id:'1',
          label:'울산바위',
          img:'https://i.imgur.com/Wt8UFpL.jpeg'
        },

        {
          id:'2',
          label:'석과비니',
          img:'https://i.imgur.com/DmQKMRM.jpeg'
        },

        {
          id:'3',
          label:'왕자님즈',
          img:'https://i.imgur.com/wdgf2a8.jpeg'
        },

        {
          id:'4',
          label:'모지리즈',
          img:'https://i.imgur.com/5dqOQwK.jpeg'
        },

        {
          id:'5',
          label:'고양이 형제',
          img:'https://i.imgur.com/ElxrbZk.jpeg'
        }

      ]
    },


    {
      key:'moehwa',
      name:'모에화',
      options:[]
    },


    {
      key:'pota',
      name:'최애 포타',
      options:[]
    }

  ];


  /* =========================================================
     상태
     ========================================================= */

  let currentCategoryIndex = 0;

  const selections = {};

  const customPins = {};

  let targetPinInfo = null;


  /* =========================================================
     기본 이미지 HTML
     ========================================================= */

  function getDefaultImageHTML(){

    return `
      <img
        src="${DEFAULT_IMAGE}"
        alt="선택 없음"
        crossorigin="anonymous"
      >
    `;

  }


  /* =========================================================
     토스트
     ========================================================= */

  function showToast(text){

    const t =
      document.getElementById('toast');

    t.textContent = text;

    t.classList.add('show');


    setTimeout(() => {

      t.classList.remove('show');

    }, 2500);

  }


  /* =========================================================
     그리드 생성
     ========================================================= */

  function initGrid(){

    const grid =
      document.getElementById('opGrid');

    grid.innerHTML = '';


    CATEGORIES.forEach(cat => {

      const cell =
        document.createElement('div');

      cell.className = 'op-cell';

      cell.dataset.key = cat.key;


      const head =
        document.createElement('div');

      head.className = 'op-head';

      head.textContent = cat.name;


      const photo =
        document.createElement('div');

      photo.className = 'op-photo';

      photo.id =
        `photo-${cat.key}`;


      photo.innerHTML =
        getDefaultImageHTML();


      const caption =
        document.createElement('div');

      caption.className =
        'op-caption placeholder';

      caption.id =
        `caption-${cat.key}`;

      caption.contentEditable = true;

      caption.setAttribute(
        'spellcheck',
        'false'
      );

      caption.setAttribute(
        'data-placeholder',
        '직접 입력'
      );


      cell.appendChild(head);

      cell.appendChild(photo);

      cell.appendChild(caption);

      grid.appendChild(cell);

    });

  }


  /* =========================================================
     탭 생성
     ========================================================= */

  function initTabs(){

    const tabsContainer =
      document.getElementById('tabs');

    tabsContainer.innerHTML = '';


    CATEGORIES.forEach(
      (cat, idx) => {

        const btn =
          document.createElement('button');

        btn.className =
          `tab-btn ${
            idx === currentCategoryIndex
              ? 'active'
              : ''
          }`;

        btn.textContent =
          cat.name;


        btn.onclick = () => {

          currentCategoryIndex =
            idx;

          renderTabs();

          renderOptions();

        };


        tabsContainer.appendChild(btn);

      }
    );

  }


  /* =========================================================
     탭 렌더링
     ========================================================= */

  function renderTabs(){

    const btns =
      document.querySelectorAll(
        '.tab-btn'
      );


    btns.forEach(
      (btn, idx) => {

        if(
          idx ===
          currentCategoryIndex
        ){

          btn.classList.add(
            'active'
          );

        }
        else{

          btn.classList.remove(
            'active'
          );

        }

      }
    );

  }


  /* =========================================================
     옵션 렌더링
     ========================================================= */

  function renderOptions(){

    const body =
      document.getElementById(
        'optionsBody'
      );

    body.innerHTML = '';


    const cat =
      CATEGORIES[
        currentCategoryIndex
      ];


    const row =
      document.createElement('div');

    row.className =
      'options-row';


    cat.options.forEach(
      opt => {

        const chip =
          document.createElement('div');


        const isSelected =
          selections[cat.key] &&
          selections[cat.key].id ===
            opt.id;


        chip.className =
          `opt-chip ${
            isSelected
              ? 'selected'
              : ''
          }`;


        const pinKey =
          `${cat.key}_${opt.id}`;


        const displayImg =
          customPins[pinKey] ||
          opt.img;


        let thumbHtml = '';


        if(displayImg){

          thumbHtml = `
            <div class="mini-thumb">

              <img
                src="${displayImg}"
                crossorigin="anonymous"
              >

            </div>
          `;

        }


        chip.innerHTML = `

          ${thumbHtml}

          <span>
            ${opt.label}
          </span>

          <button
            class="pin-btn"
            title="고정 사진 설정"
          >
            📷
          </button>

        `;


        chip.onclick = (e) => {

          if(
            e.target.classList.contains(
              'pin-btn'
            )
          ){

            return;

          }


          selectOption(
            cat.key,
            opt.id,
            opt.label,
            displayImg
          );

        };


        const pinBtn =
          chip.querySelector(
            '.pin-btn'
          );


        pinBtn.onclick = (e) => {

          e.stopPropagation();


          targetPinInfo = {

            catKey:
              cat.key,

            optId:
              opt.id

          };


          document
            .getElementById(
              'fileInputPin'
            )
            .click();

        };


        row.appendChild(chip);

      }
    );


    /* -------------------------------------------------------
       그 외 직접 업로드
       ------------------------------------------------------- */

    const customChip =
      document.createElement('div');


    const isCustomSelected =
      selections[cat.key] &&
      selections[cat.key].id ===
        'custom';


    customChip.className =
      `opt-chip custom ${
        isCustomSelected
          ? 'selected'
          : ''
      }`;


    customChip.innerHTML =
      `<span>➕ 그 외 (직접 업로드)</span>`;


    customChip.onclick = () => {

      document
        .getElementById(
          'fileInputCustom'
        )
        .click();

    };


    row.appendChild(
      customChip
    );


    body.appendChild(row);

  }


  /* =========================================================
     옵션 선택
     ========================================================= */

  function selectOption(
    catKey,
    id,
    label,
    imgSrc
  ){

    selections[catKey] = {

      id:id,

      label:label,

      img:imgSrc

    };


    const photoEl =
      document.getElementById(
        `photo-${catKey}`
      );


    const captionEl =
      document.getElementById(
        `caption-${catKey}`
      );


    if(imgSrc){

      photoEl.innerHTML = `

        <img
          src="${imgSrc}"
          alt="${label}"
          crossorigin="anonymous"
        >

      `;

    }
    else{

      photoEl.innerHTML =
        getDefaultImageHTML();

    }


    if(label){

      captionEl.textContent =
        label;

      captionEl.classList.remove(
        'placeholder'
      );

    }


    renderOptions();

  }


  /* =========================================================
     직접 사진 업로드
     ========================================================= */

  document
    .getElementById(
      'fileInputCustom'
    )
    .onchange =
    function(e){

      const file =
        e.target.files[0];


      if(!file){

        return;

      }


      const reader =
        new FileReader();


      reader.onload =
        function(evt){

          const cat =
            CATEGORIES[
              currentCategoryIndex
            ];


          selectOption(

            cat.key,

            'custom',

            '직접 입력',

            evt.target.result

          );

        };


      reader.readAsDataURL(file);

      e.target.value = '';

    };


  /* =========================================================
     고정 사진 업로드
     ========================================================= */

  document
    .getElementById(
      'fileInputPin'
    )
    .onchange =
    function(e){

      const file =
        e.target.files[0];


      if(
        !file ||
        !targetPinInfo
      ){

        return;

      }


      const reader =
        new FileReader();


      reader.onload =
        function(evt){

          const pinKey =
            `${targetPinInfo.catKey}_${targetPinInfo.optId}`;


          customPins[pinKey] =
            evt.target.result;


          const currentSel =
            selections[
              targetPinInfo.catKey
            ];


          if(
            currentSel &&
            currentSel.id ===
              targetPinInfo.optId
          ){

            selectOption(

              targetPinInfo.catKey,

              targetPinInfo.optId,

              currentSel.label,

              evt.target.result

            );

          }
          else{

            renderOptions();

          }


          showToast(
            '고정 사진이 지정되었습니다.'
          );

        };


      reader.readAsDataURL(file);

      e.target.value = '';

    };


  /* =========================================================
     이미지 로딩 대기
     ========================================================= */

  function waitForImage(img){

    return new Promise(resolve => {

      if(
        img.complete &&
        img.naturalWidth > 0
      ){

        resolve();

        return;

      }


      let finished = false;


      const done = () => {

        if(finished){
          return;
        }

        finished = true;

        img.removeEventListener(
          'load',
          done
        );

        img.removeEventListener(
          'error',
          done
        );

        resolve();

      };


      img.addEventListener(
        'load',
        done,
        {once:true}
      );

      img.addEventListener(
        'error',
        done,
        {once:true}
      );


      /*
        혹시 외부 이미지가 아주 늦게 로딩될 경우
        저장이 영원히 멈추지 않도록 안전장치
      */

      setTimeout(
        done,
        15000
      );

    });

  }


  /* =========================================================
     원본 이미지를 정사각형으로 실제 크롭

     ★ 핵심 수정 부분

     기존:
       원본
        ↓
       무조건 1200px
        ↓
       html2canvas가 다시 축소

     수정:
       원본
        ↓
       최종 캡처 크기에 맞는 픽셀 크기로 크롭
        ↓
       html2canvas
        ↓
       PNG

     따라서 불필요한 다운샘플링을 크게 줄입니다.
     ========================================================= */

  function makeCropCanvas(
    img,
    cssWidth,
    cssHeight
  ){

    const sourceWidth =
      img.naturalWidth;

    const sourceHeight =
      img.naturalHeight;


    if(
      !sourceWidth ||
      !sourceHeight
    ){

      return null;

    }


    /*
      화면의 실제 비율

      현재 표 사진은 1:1이지만
      CSS 변경에 대비해서 실제 비율을 계산합니다.
    */

    const targetRatio =
      cssWidth / cssHeight;


    const sourceRatio =
      sourceWidth / sourceHeight;


    let cropWidth =
      sourceWidth;

    let cropHeight =
      sourceHeight;

    let sourceX = 0;

    let sourceY = 0;


    /*
      object-fit:cover와 동일한 방식으로
      중앙 크롭합니다.
    */

    if(
      sourceRatio > targetRatio
    ){

      cropWidth =
        Math.round(
          sourceHeight *
          targetRatio
        );

      cropWidth =
        Math.min(
          cropWidth,
          sourceWidth
        );

      sourceX =
        Math.floor(
          (sourceWidth - cropWidth) / 2
        );

    }
    else if(
      sourceRatio < targetRatio
    ){

      cropHeight =
        Math.round(
          sourceWidth /
          targetRatio
        );

      cropHeight =
        Math.min(
          cropHeight,
          sourceHeight
        );

      sourceY =
        Math.floor(
          (sourceHeight - cropHeight) / 2
        );

    }


    /*
      최종 캡처 이미지에서
      이 사진이 차지하는 실제 픽셀 수.

      예:
        화면에서 150px
        EXPORT_SCALE = 3

        → 450 x 450px

      기존의 무조건 1200px보다
      훨씬 합리적으로 원본을 사용합니다.
    */

    const outputWidth =
      Math.max(
        1,
        Math.round(
          cssWidth *
          EXPORT_SCALE
        )
      );


    const outputHeight =
      Math.max(
        1,
        Math.round(
          cssHeight *
          EXPORT_SCALE
        )
      );


    const canvas =
      document.createElement(
        'canvas'
      );


    canvas.width =
      outputWidth;

    canvas.height =
      outputHeight;


    const ctx =
      canvas.getContext(
        '2d',
        {
          alpha:false
        }
      );


    if(!ctx){

      return null;

    }


    /*
      JPEG/PNG 원본의 가장자리에서
      브라우저가 반투명 픽셀을 만드는 것을
      최소화하기 위한 설정
    */

    ctx.imageSmoothingEnabled =
      true;

    ctx.imageSmoothingQuality =
      'high';


    /*
      배경을 먼저 검정으로 채움.

      이미지가 정확하게 꽉 차기 때문에
      정상적인 경우 이 배경은 보이지 않습니다.
    */

    ctx.fillStyle =
      '#000';

    ctx.fillRect(
      0,
      0,
      outputWidth,
      outputHeight
    );


    /*
      핵심:
      fractional crop 좌표를 쓰지 않고
      전부 정수 픽셀로 처리합니다.

      이게 사진 가장자리의
      미세한 흰색/밝은 선 문제를 줄여줍니다.
    */

    ctx.drawImage(

      img,

      sourceX,
      sourceY,

      cropWidth,
      cropHeight,

      0,
      0,

      outputWidth,
      outputHeight

    );


    /*
      html2canvas가 이 canvas를
      일반 이미지처럼 처리할 수 있도록
      CSS 크기는 화면과 동일하게 설정합니다.
    */

    canvas.style.width =
      '100%';

    canvas.style.height =
      '100%';

    canvas.style.display =
      'block';

    canvas.style.objectFit =
      'cover';


    return canvas;

  }


  /* =========================================================
     다운로드용 이미지 임시 교체
     ========================================================= */

  async function prepareCaptureImages(){

    const restoreList = [];


    const photoImages =
      Array.from(
        document.querySelectorAll(
          '#capture .op-photo img'
        )
      );


    for(
      const img of photoImages
    ){

      await waitForImage(img);


      const photoBox =
        img.closest(
          '.op-photo'
        );


      if(!photoBox){

        continue;

      }


      /*
        실제 화면상의 사진 크기를 가져옵니다.
      */

      const rect =
        photoBox.getBoundingClientRect();


      const cssWidth =
        Math.max(
          1,
          Math.round(
            rect.width
          )
        );


      const cssHeight =
        Math.max(
          1,
          Math.round(
            rect.height
          )
        );


      let cropCanvas =
        null;


      try{

        cropCanvas =
          makeCropCanvas(
            img,
            cssWidth,
            cssHeight
          );

      }
      catch(error){

        console.error(
          '사진 크롭 오류:',
          error
        );

      }


      if(!cropCanvas){

        continue;

      }


      const parent =
        img.parentNode;


      if(!parent){

        continue;

      }


      const nextSibling =
        img.nextSibling;


      parent.replaceChild(
        cropCanvas,
        img
      );


      restoreList.push({

        parent,

        img,

        cropCanvas,

        nextSibling

      });

    }


    /*
      DOM 변경사항을 브라우저가
      실제 레이아웃에 반영하도록
      두 프레임 기다립니다.
    */

    await new Promise(
      resolve => {

        requestAnimationFrame(
          () => {

            requestAnimationFrame(
              resolve
            );

          }
        );

      }
    );


    return function restore(){

      restoreList.forEach(
        item => {

          if(
            item.nextSibling &&
            item.nextSibling.parentNode ===
              item.parent
          ){

            item.parent.insertBefore(

              item.img,

              item.nextSibling

            );

          }
          else{

            item.parent.appendChild(
              item.img
            );

          }


          item.cropCanvas.remove();

        }
      );

    };

  }


  /* =========================================================
     이미지 저장
     ========================================================= */

  document
    .getElementById('saveBtn')
    .onclick =
    async function(){

      const saveBtn =
        document.getElementById(
          'saveBtn'
        );


      /*
        중복 클릭 방지
      */

      if(
        saveBtn.dataset.saving ===
        'true'
      ){

        return;

      }


      saveBtn.dataset.saving =
        'true';


      saveBtn.disabled =
        true;


      saveBtn.textContent =
        '이미지 생성 중...';


      let restoreImages =
        null;


      try{

        const captureEl =
          document.getElementById(
            'capture'
          );


        /* ---------------------------------------------------
           1. 이미지 실제 크롭
           --------------------------------------------------- */

        restoreImages =
          await prepareCaptureImages();


        /* ---------------------------------------------------
           2. 고화질 캡처

           기존:
             scale:2

           수정:
             scale:3
           --------------------------------------------------- */

        const canvas =
          await html2canvas(

            captureEl,

            {

              scale:
                EXPORT_SCALE,

              useCORS:
                true,

              allowTaint:
                false,

              backgroundColor:
                '#000',

              imageTimeout:
                15000,

              logging:
                false,

              /*
                브라우저의 현재 화면 크기와
                캡처 크기를 정확하게 맞춥니다.
              */

              width:
                captureEl.scrollWidth,

              height:
                captureEl.scrollHeight,

              /*
                스크롤 위치와 관계없이
                표 전체를 캡처
              */

              scrollX:
                0,

              scrollY:
                0

            }

          );


        /* ---------------------------------------------------
           3. 화면 원상복구
           --------------------------------------------------- */

        if(restoreImages){

          restoreImages();

          restoreImages =
            null;

        }


        /* ---------------------------------------------------
           4. PNG 생성

           PNG quality는 lossless이므로
           1.0을 사용합니다.
           --------------------------------------------------- */

        const blob =
          await new Promise(

            (resolve, reject) => {

              canvas.toBlob(

                result => {

                  if(result){

                    resolve(
                      result
                    );

                  }
                  else{

                    reject(

                      new Error(
                        'PNG 생성에 실패했습니다.'
                      )

                    );

                  }

                },

                'image/png',

                1.0

              );

            }

          );


        const fileName =
          '넨석_취향표.png';


        /* ---------------------------------------------------
           5. 모바일 공유
           --------------------------------------------------- */

        if(

          typeof navigator !==
            'undefined' &&

          navigator.share &&

          typeof File !==
            'undefined'

        ){

          try{

            const file =
              new File(

                [blob],

                fileName,

                {
                  type:
                    'image/png'
                }

              );


            let canShareFiles =
              false;


            if(
              navigator.canShare
            ){

              try{

                canShareFiles =
                  navigator.canShare({

                    files:[
                      file
                    ]

                  });

              }
              catch(e){

                canShareFiles =
                  false;

              }

            }


            if(
              canShareFiles
            ){

              await navigator.share({

                files:[
                  file
                ],

                title:
                  '넨석 취향표',

                text:
                  '넨석 취향표 이미지'

              });


              showToast(
                '이미지 저장/공유 메뉴를 완료했습니다.'
              );


              return;

            }

          }
          catch(
            shareError
          ){

            if(

              shareError &&

              shareError.name ===
                'AbortError'

            ){

              return;

            }


            console.log(
              '모바일 공유 방식 실패:',
              shareError
            );

          }

        }


        /* ---------------------------------------------------
           6. 일반 다운로드
           --------------------------------------------------- */

        const blobUrl =
          URL.createObjectURL(
            blob
          );


        const link =
          document.createElement(
            'a'
          );


        link.href =
          blobUrl;

        link.download =
          fileName;

        link.style.display =
          'none';


        document.body.appendChild(
          link
        );


        link.click();


        setTimeout(
          () => {

            URL.revokeObjectURL(
              blobUrl
            );

            link.remove();

          },

          10000

        );


        showToast(
          '이미지 저장을 시작했습니다.'
        );


      }
      catch(err){

        console.error(
          '이미지 저장 오류:',
          err
        );


        /*
          오류가 나도
          반드시 화면 복구
        */

        if(
          restoreImages
        ){

          try{

            restoreImages();

          }
          catch(e){

            console.error(e);

          }

        }


        showToast(
          '이미지 저장에 실패했습니다. 다시 시도해주세요.'
        );

      }
      finally{

        saveBtn.dataset.saving =
          'false';


        saveBtn.disabled =
          false;


        saveBtn.textContent =
          '이미지로 저장';

      }

    };


  /* =========================================================
     초기화
     ========================================================= */

  document
    .getElementById('resetBtn')
    .onclick =
    function(){

      if(
        !confirm(
          '작성 내용을 초기화하시겠습니까?'
        )
      ){

        return;

      }


      CATEGORIES.forEach(
        cat => {

          delete selections[
            cat.key
          ];


          const photoEl =
            document.getElementById(
              `photo-${cat.key}`
            );


          const captionEl =
            document.getElementById(
              `caption-${cat.key}`
            );


          photoEl.innerHTML =
            getDefaultImageHTML();


          captionEl.textContent =
            '';


          captionEl.classList.add(
            'placeholder'
          );

        }
      );


      renderOptions();


      showToast(
        '초기화되었습니다.'
      );

    };


  /* =========================================================
     실행
     ========================================================= */

  initGrid();

  initTabs();

  renderOptions();


})();
</script>
