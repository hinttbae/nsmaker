<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>넨석 취향표 만들기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --line:#c9c9c9;
    --ink:#000;
    --muted:#888;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:#f2f2f2;
    color:#222;
    font-family:'Noto Sans KR', sans-serif;
    min-height:100vh;
  }
  .page{
    max-width:640px;
    margin:0 auto;
    padding:32px 16px 70px;
  }
  header{
    text-align:center;
    margin-bottom:22px;
  }
  h1{
    font-size:24px;
    font-weight:900;
    margin:0 0 4px;
    letter-spacing:-0.01em;
  }
  header p{
    margin:0;
    color:var(--muted);
    font-size:13px;
  }

  /* ===== 표(캡처 영역) ===== */
  #capture{
    background:#000;
    border:3px solid #000;
  }
  .capture-title{
    padding:16px 10px 14px;
    text-align:center;
  }
  .chart-title{
    font-size:22px;
    font-weight:900;
    color:#fff;
    outline:none;
  }
  .chart-handle{
    font-size:12px;
    color:rgba(255,255,255,0.65);
    outline:none;
    margin-top:2px;
  }
  [contenteditable]:focus{ background:rgba(255,255,255,0.12); }

  /* 4x2 그리드 배열 설정 */
  .op-grid{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:3px;
    background:#000;
  }
  .op-cell{
    background:#fff;
    display:flex;
    flex-direction:column;
  }
  .op-head{
    background:#000;
    color:#fff;
    font-size:12px;
    font-weight:700;
    text-align:center;
    padding:7px 2px;
    letter-spacing:0.01em;
    word-break:keep-all;
  }
  .op-photo{
    aspect-ratio:1/1;
    background:#e9e9e9;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }
  .op-photo img{ width:100%; height:100%; object-fit:cover; display:block; }
  .op-photo .empty-label{
    font-size:11px;
    color:#aaa;
    text-align:center;
  }
  .op-caption{
    background:#fff;
    color:#000;
    font-weight:700;
    font-size:12px;
    text-align:center;
    padding:6px 2px;
    border-top:2px solid #000;
    word-break:break-all;
    min-height:28px;
  }
  .op-caption[contenteditable]{ outline:none; cursor:text; }
  .op-caption[contenteditable]:empty::before{
    content:attr(data-placeholder);
    color:#bbb;
    font-weight:400;
  }

  /* ===== 컨트롤 패널 ===== */
  .panel{
    margin-top:18px;
    border:1px solid var(--line);
    background:#fff;
  }
  .tabs{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    border-bottom:1px solid var(--line);
  }
  .tab-btn{
    width:100%;
    font-family:'Noto Sans KR', sans-serif;
    font-size:12px;
    font-weight:700;
    padding:10px 2px;
    border:none;
    border-right:1px solid var(--line);
    border-bottom:1px solid var(--line);
    background:#fff;
    color:#666;
    cursor:pointer;
    text-align:center;
  }
  .tab-btn:nth-child(4n){ border-right:none; }
  .tab-btn:nth-child(n+5){ border-bottom:none; }
  .tab-btn:hover{ background:#f5f5f5; }
  .tab-btn.active{
    background:var(--ink);
    color:#fff;
  }

  .options-body{ padding:12px; }
  .options-row{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }
  .opt-chip{
    position:relative;
    display:flex;
    align-items:center;
    gap:6px;
    border:1px solid var(--line);
    padding:6px 10px 6px 6px;
    cursor:pointer;
    background:#fff;
    font-size:12px;
    color:#222;
  }
  .opt-chip:hover{ border-color:#999; }
  .opt-chip.selected{
    border-color:var(--ink);
    background:#f2f2f2;
    font-weight:700;
  }
  .opt-chip .mini-thumb{
    width:26px; height:26px;
    background:#eee;
    border:1px solid var(--line);
    overflow:hidden;
    flex:0 0 auto;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .opt-chip .mini-thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
  .opt-chip.custom{ border-style:dashed; }

  .actions{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-top:18px;
  }
  .action-btn{
    font-family:'Noto Sans KR', sans-serif;
    font-size:13px;
    font-weight:700;
    padding:10px 20px;
    border-radius:2px;
    border:1px solid #000;
    cursor:pointer;
  }
  .action-btn.primary{ background:#000; color:#fff; }
  .action-btn.ghost{ background:#fff; color:#000; }
  .action-btn:hover{ opacity:0.85; }

  .hint{
    margin-top:14px;
    font-size:12px;
    color:var(--muted);
    line-height:1.6;
    border-top:1px dashed var(--line);
    padding-top:12px;
  }

  .toast{
    position:fixed;
    left:50%; bottom:26px;
    transform:translateX(-50%) translateY(20px);
    background:#000;
    color:#fff;
    padding:10px 18px;
    font-size:13px;
    opacity:0;
    pointer-events:none;
    transition:all .2s ease;
    z-index:9999;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  @media (max-width:480px){
    .op-head{ font-size:10px; padding:5px 1px; }
    .op-caption{ font-size:11px; }
    .tab-btn{ font-size:11px; padding:8px 1px; }
  }
</style>
</head>
<body>
<div class="page">
  <header>
    <h1>❤️넨석 취향표 만들기❤️</h1>
    <p>항목별 보기를 선택해 표를 완성하고, 이미지로 저장해보세요.</p>
  </header>

  <div id="capture">
    <div class="capture-title">
      <div class="chart-title" contenteditable="true" spellcheck="false">❤️넨석 취향표❤️</div>
      <div class="chart-handle" contenteditable="true" spellcheck="false">@닉네임</div>
    </div>
    <div class="op-grid" id="opGrid"></div>
  </div>

  <div class="panel">
    <div class="tabs" id="tabs"></div>
    <div class="options-body" id="optionsBody"></div>
  </div>

  <input type="file" id="fileInputCustom" accept="image/*" style="display:none">

  <div class="actions">
    <button class="action-btn primary" id="saveBtn">이미지로 저장</button>
    <button class="action-btn ghost" id="resetBtn">초기화</button>
  </div>

  <div class="hint">
    📌 오류 및 수정 문의는 spin-spin.com/kkamgotheleft 로 보내주세요. <br>
    📌 보기에 없는 답을 쓰고 싶다면 각 항목의 <b>[그 외]</b> 칩을 눌러 직접 사진을 올리면 됩니다.
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
(function(){
  // 카테고리 설정
  const CATEGORIES = [
    { key: 'choiae', name: '최애', options: [{ id: '1', label: '원빈', img: '' }] },
    { key: 'tteokbab', name: '최애 떡밥', options: [] },
    { key: 'ipdeok', name: '입덕 계기', options: [] },
    { key: 'reels', name: '릴스', options: [] },
    { key: 'core', name: '코어', options: [] },
    { key: 'combination', name: '조합명', options: [] },
    { key: 'moe', name: '모에화', options: [] },
    { key: 'pota', name: '최애 포타', options: [] }
  ];

  // 각 카테고리별 현재 선택 상태 저장
  const state = {};
  CATEGORIES.forEach(cat => {
    state[cat.key] = { selectedOption: null, customImg: null, customLabel: '' };
  });

  let currentTabKey = CATEGORIES[0].key;

  // DOM 요소를 가져옵니다.
  const opGrid = document.getElementById('opGrid');
  const tabs = document.getElementById('tabs');
  const optionsBody = document.getElementById('optionsBody');
  const fileInputCustom = document.getElementById('fileInputCustom');
  const saveBtn = document.getElementById('saveBtn');
  const resetBtn = document.getElementById('resetBtn');
  const toast = document.getElementById('toast');

  // 토스트 메시지 출력
  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2000);
  }

  // 1. Grid (표) 초기화 및 렌더링
  function renderGrid() {
    opGrid.innerHTML = '';
    CATEGORIES.forEach(cat => {
      const catState = state[cat.key];
      const cell = document.createElement('div');
      cell.className = 'op-cell';

      // 이미지 영역 구하기
      let imgHtml = '<div class="empty-label">선택 안 함</div>';
      let labelText = '';

      if (catState.selectedOption === 'custom') {
        if (catState.customImg) {
          imgHtml = `<img src="${catState.customImg}" alt="custom">`;
        } else {
          imgHtml = '<div class="empty-label">이미지 업로드</div>';
        }
        labelText = catState.customLabel;
      } else if (catState.selectedOption) {
        const opt = cat.options.find(o => o.id === catState.selectedOption);
        if (opt) {
          imgHtml = opt.img ? `<img src="${opt.img}" alt="${opt.label}">` : `<div class="empty-label">${opt.label}</div>`;
          labelText = opt.label;
        }
      }

      cell.innerHTML = `
        <div class="op-head">${cat.name}</div>
        <div class="op-photo">${imgHtml}</div>
        <div class="op-caption" contenteditable="true" spellcheck="false" data-placeholder="직접 입력">${labelText}</div>
      `;

      // 캡션 직접 수정 시 state 반영
      const captionEl = cell.querySelector('.op-caption');
      captionEl.addEventListener('input', (e) => {
        if (catState.selectedOption === 'custom') {
          catState.customLabel = e.target.innerText;
        }
      });

      opGrid.appendChild(cell);
    });
  }

  // 2. 컨트롤 패널 (탭 및 옵션 칩) 렌더링
  function renderPanel() {
    // 탭 생성
    tabs.innerHTML = '';
    CATEGORIES.forEach(cat => {
      const btn = document.createElement('button');
      btn.className = `tab-btn ${cat.key === currentTabKey ? 'active' : ''}`;
      btn.textContent = cat.name;
      btn.onclick = () => {
        currentTabKey = cat.key;
        renderPanel();
      };
      tabs.appendChild(btn);
    });

    // 옵션 칩 생성
    optionsBody.innerHTML = '';
    const activeCat = CATEGORIES.find(c => c.key === currentTabKey);
    const catState = state[currentTabKey];

    const row = document.createElement('div');
    row.className = 'options-row';

    // 기본 옵션 칩들
    activeCat.options.forEach(opt => {
      const chip = document.createElement('div');
      chip.className = `opt-chip ${catState.selectedOption === opt.id ? 'selected' : ''}`;
      
      const thumb = opt.img ? `<img src="${opt.img}">` : '<span>-</span>';
      chip.innerHTML = `<div class="mini-thumb">${thumb}</div><span>${opt.label}</span>`;
      
      chip.onclick = () => {
        catState.selectedOption = (catState.selectedOption === opt.id) ? null : opt.id;
        renderGrid();
        renderPanel();
      };
      row.appendChild(chip);
    });

    // [그 외] 커스텀 칩
    const customChip = document.createElement('div');
    customChip.className = `opt-chip custom ${catState.selectedOption === 'custom' ? 'selected' : ''}`;
    const customThumb = catState.customImg ? `<img src="${catState.customImg}">` : '<span>+</span>';
    customChip.innerHTML = `<div class="mini-thumb">${customThumb}</div><span>[그 외]</span>`;
    
    customChip.onclick = () => {
      catState.selectedOption = 'custom';
      fileInputCustom.click(); // 파일 선택창 열기
    };
    row.appendChild(customChip);

    optionsBody.appendChild(row);
  }

  // 파일 업로드 처리
  fileInputCustom.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = (event) => {
      state[currentTabKey].customImg = event.target.result;
      renderGrid();
      renderPanel();
      fileInputCustom.value = ''; // 초기화
    };
    reader.readAsDataURL(file);
  });

  // 이미지 저장 기능 (html2canvas 사용)
  saveBtn.addEventListener('click', () => {
    showToast('이미지 생성 중입니다...');
    const captureEl = document.getElementById('capture');

    html2canvas(captureEl, {
      scale: 2, // 고화질 저장
      useCORS: true
    }).then(canvas => {
      const link = document.createElement('a');
      link.download = '취향표.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
      showToast('이미지가 저장되었습니다!');
    }).catch(() => {
      showToast('저장 중 오류가 발생했습니다.');
    });
  });

  // 초기화 버튼
  resetBtn.addEventListener('click', () => {
    if (confirm('모든 선택 내역을 초기화하시겠습니까?')) {
      CATEGORIES.forEach(cat => {
        state[cat.key] = { selectedOption: null, customImg: null, customLabel: '' };
      });
      renderGrid();
      renderPanel();
      showToast('초기화되었습니다.');
    }
  });

  // 최초 앱 시작
  renderGrid();
  renderPanel();
})();
</script>
</body>
</html>
