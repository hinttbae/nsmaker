<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>넨석 취향표 만들기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --line:#c9c9c9;
    --ink:#000;
    --muted:#888;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:#f2f2f2;
    color:#222;
    font-family:'Noto Sans KR', sans-serif;
    min-height:100vh;
  }
  .page{
    max-width:640px;
    margin:0 auto;
    padding:32px 16px 70px;
  }
  header{
    text-align:center;
    margin-bottom:22px;
  }
  h1{
    font-size:24px;
    font-weight:900;
    margin:0 0 4px;
    letter-spacing:-0.01em;
  }
  header p{
    margin:0;
    color:var(--muted);
    font-size:13px;
  }

  /* ===== 표(캡처 영역) ===== */
  #capture{
    background:#000;
    border:3px solid #000;
  }
  .capture-title{
    padding:16px 10px 14px;
    text-align:center;
  }
  .chart-title{
    font-size:22px;
    font-weight:900;
    color:#fff;
    outline:none;
  }
  .chart-handle{
    font-size:12px;
    color:rgba(255,255,255,0.65);
    outline:none;
    margin-top:2px;
  }
  [contenteditable]:focus{ background:rgba(255,255,255,0.12); }

  /* 4x2 그리드 배열 설정 */
  .op-grid{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:3px;
    background:#000;
  }
  .op-cell{
    background:#fff;
    display:flex;
    flex-direction:column;
  }
  .op-head{
    background:#000;
    color:#fff;
    font-size:12px;
    font-weight:700;
    text-align:center;
    padding:7px 2px;
    letter-spacing:0.01em;
    word-break:keep-all;
  }
  .op-photo{
    aspect-ratio:1/1;
    background:#e9e9e9;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }
  .op-photo img{ width:100%; height:100%; object-fit:cover; display:block; }
  .op-photo .empty-label{
    font-size:11px;
    color:#aaa;
    text-align:center;
  }
  .op-caption[contenteditable]{ outline:none; cursor:text; }
  .op-caption[contenteditable]:empty::before{
    content:attr(data-placeholder);
    color:#bbb;
    font-weight:400;
  }
  .op-caption{
    background:#fff;
    color:#000;
    font-weight:700;
    font-size:12px;
    text-align:center;
    padding:6px 2px;
    border-top:2px solid #000;
    word-break:break-all;
  }
  .op-caption.placeholder{ color:#bbb; font-weight:400; }

  /* ===== 컨트롤 패널 ===== */
  .panel{
    margin-top:18px;
    border:1px solid var(--line);
    background:#fff;
  }
  /* 탭 항목 선택 창 4x2 그리드 적용 */
  .tabs{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    border-bottom:1px solid var(--line);
  }
  .tab-btn{
    width:100%;
    font-family:'Noto Sans KR', sans-serif;
    font-size:12px;
    font-weight:700;
    padding:10px 2px;
    border:none;
    border-right:1px solid var(--line);
    border-bottom:1px solid var(--line);
    background:#fff;
    color:#666;
    cursor:pointer;
    text-align:center;
  }
  .tab-btn:nth-child(4n){ border-right:none; }
  .tab-btn:nth-child(n+5){ border-bottom:none; }
  .tab-btn:hover{ background:#f5f5f5; }
  .tab-btn.active{
    background:var(--ink);
    color:#fff;
  }

  .options-body{ padding:12px; }
  .options-row{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }
  .opt-chip{
    position:relative;
    display:flex;
    align-items:center;
    gap:6px;
    border:1px solid var(--line);
    padding:6px 10px 6px 6px;
    cursor:pointer;
    background:#fff;
    font-size:12px;
    color:#222;
  }
  .opt-chip:hover{ border-color:#999; }
  .opt-chip.selected{
    border-color:var(--ink);
    background:#f2f2f2;
    font-weight:700;
  }
  .opt-chip .mini-thumb{
    width:26px; height:26px;
    background:#eee;
    border:1px solid var(--line);
    overflow:hidden;
    flex:0 0 auto;
  }
  .opt-chip .mini-thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
  .opt-chip .pin-btn{
    border:none;
    background:none;
    cursor:pointer;
    font-size:12px;
    color:#999;
    padding:0 0 0 2px;
    line-height:1;
  }
  .opt-chip .pin-btn:hover{ color:#000; }
  .opt-chip.custom{ border-style:dashed; }

  .actions{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-top:18px;
  }
  .action-btn{
    font-family:'Noto Sans KR', sans-serif;
    font-size:13px;
    font-weight:700;
    padding:10px 20px;
    border-radius:2px;
    border:1px solid #000;
    cursor:pointer;
  }
  .action-btn.primary{ background:#000; color:#fff; }
  .action-btn.ghost{ background:#fff; color:#000; }
  .action-btn:hover{ opacity:0.85; }

  .hint{
    margin-top:14px;
    font-size:12px;
    color:var(--muted);
    line-height:1.6;
    border-top:1px dashed var(--line);
    padding-top:12px;
  }

  .toast{
    position:fixed;
    left:50%; bottom:26px;
    transform:translateX(-50%) translateY(20px);
    background:#000;
    color:#fff;
    padding:10px 18px;
    font-size:13px;
    opacity:0;
    pointer-events:none;
    transition:all .2s ease;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  @media (max-width:480px){
    .op-head{ font-size:10px; padding:5px 1px; }
    .op-caption{ font-size:11px; }
    .tab-btn{ font-size:11px; padding:8px 1px; }
  }
</style>
</head>
<body>
<div class="page">
  <header>
    <h1>❤️넨석 취향표 만들기❤️</h1>
    <p>항목별 보기를 선택해 표를 완성하고, 이미지로 저장해보세요.</p>
  </header>

  <div id="capture">
    <div class="capture-title">
      <div class="chart-title" contenteditable="true" spellcheck="false">나의 취향표</div>
      <div class="chart-handle" contenteditable="true" spellcheck="false">@닉네임</div>
    </div>
    <div class="op-grid" id="opGrid"></div>
  </div>

  <div class="panel">
    <div class="tabs" id="tabs"></div>
    <div class="options-body" id="optionsBody"></div>
  </div>

  <input type="file" id="fileInputCustom" accept="image/*" style="display:none">
  <input type="file" id="fileInputPin" accept="image/*" style="display:none">

  <div class="actions">
    <button class="action-btn primary" id="saveBtn">이미지로 저장</button>
    <button class="action-btn ghost" id="resetBtn">초기화</button>
  </div>

  <div class="hint">
    📌 오류 및 수정 문의는 spin-spin.com/kkamgotheleft 로 보내주세요. <br>
    📌 보기에 없는 답을 쓰고 싶다면 각 항목의 <b>[그 외]</b> 칩을 눌러 직접 사진을 올리면 됩니다.
  </div>
</div>

<div class="toast" id="toast"></div>

  function showToast(text){
    const t = document.getElementById('toast');
    t.textContent = text;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2000);
  }

  function initGrid(){
    const grid = document.getElementById('opGrid');
    grid.innerHTML = '';
    CATEGORIES.forEach(cat => {
      const cell = document.createElement('div');
      cell.className = 'op-cell';
      cell.dataset.key = cat.key;

      const head = document.createElement('div');
      head.className = 'op-head';
      head.textContent = cat.name;

      const photo = document.createElement('div');
      photo.className = 'op-photo';
      photo.id = `photo-${cat.key}`;
      photo.innerHTML = `<span class="empty-label">선택 없음</span>`;

      const caption = document.createElement('div');
      caption.className = 'op-caption placeholder';
      caption.id = `caption-${cat.key}`;
      caption.contentEditable = true;
      caption.setAttribute('spellcheck', 'false');
      caption.setAttribute('data-placeholder', '직접 입력');

      cell.appendChild(head);
      cell.appendChild(photo);
      cell.appendChild(caption);
      grid.appendChild(cell);
    });
  }

  function initTabs(){
    const tabsContainer = document.getElementById('tabs');
    tabsContainer.innerHTML = '';
    CATEGORIES.forEach((cat, idx) => {
      const btn = document.createElement('button');
      btn.className = `tab-btn ${idx === currentCategoryIndex ? 'active' : ''}`;
      btn.textContent = cat.name;
      btn.onclick = () => {
        currentCategoryIndex = idx;
        renderTabs();
        renderOptions();
      };
      tabsContainer.appendChild(btn);
    });
  }

  function renderTabs(){
    const btns = document.querySelectorAll('.tab-btn');
    btns.forEach((btn, idx) => {
      if(idx === currentCategoryIndex) btn.classList.add('active');
      else btn.classList.remove('active');
    });
  }

  function renderOptions(){
    const body = document.getElementById('optionsBody');
    body.innerHTML = '';
    const cat = CATEGORIES[currentCategoryIndex];

    const row = document.createElement('div');
    row.className = 'options-row';

    // 1. 프리셋 보기 출력
    cat.options.forEach(opt => {
      const chip = document.createElement('div');
      const isSelected = selections[cat.key] && selections[cat.key].id === opt.id;
      chip.className = `opt-chip ${isSelected ? 'selected' : ''}`;

      const pinKey = `${cat.key}_${opt.id}`;
      const displayImg = customPins[pinKey] || opt.img;

      let thumbHtml = '';
      if(displayImg){
        thumbHtml = `<div class="mini-thumb"><img src="${displayImg}"></div>`;
      }

      chip.innerHTML = `
        ${thumbHtml}
        <span>${opt.label}</span>
        <button class="pin-btn" title="고정 사진 설정">📷</button>
      `;

      chip.onclick = (e) => {
        if(e.target.classList.contains('pin-btn')) return;
        selectOption(cat.key, opt.id, opt.label, displayImg);
      };

      const pinBtn = chip.querySelector('.pin-btn');
      pinBtn.onclick = (e) => {
        e.stopPropagation();
        targetPinInfo = { catKey: cat.key, optId: opt.id };
        document.getElementById('fileInputPin').click();
      };

      row.appendChild(chip);
    });

    // 2. [그 외 (직접 업로드)] 칩 출력
    const customChip = document.createElement('div');
    const isCustomSelected = selections[cat.key] && selections[cat.key].id === 'custom';
    customChip.className = `opt-chip custom ${isCustomSelected ? 'selected' : ''}`;
    customChip.innerHTML = `<span>➕ 그 외 (직접 업로드)</span>`;
    customChip.onclick = () => {
      document.getElementById('fileInputCustom').click();
    };
    row.appendChild(customChip);

    body.appendChild(row);
  }

  function selectOption(catKey, id, label, imgSrc){
    selections[catKey] = { id, label, img: imgSrc };

    const photoEl = document.getElementById(`photo-${catKey}`);
    const captionEl = document.getElementById(`caption-${catKey}`);

    if(imgSrc){
      photoEl.innerHTML = `<img src="${imgSrc}" alt="${label}">`;
    } else {
      photoEl.innerHTML = `<span class="empty-label">${label}</span>`;
    }

    if(label){
      captionEl.textContent = label;
      captionEl.classList.remove('placeholder');
    }

    renderOptions();
  }

  // 파일 업로드 이벤트
  document.getElementById('fileInputCustom').onchange = function(e){
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = function(evt){
      const cat = CATEGORIES[currentCategoryIndex];
      selectOption(cat.key, 'custom', '직접 입력', evt.target.result);
    };
    reader.readAsDataURL(file);
    e.target.value = '';
  };

  document.getElementById('fileInputPin').onchange = function(e){
    const file = e.target.files[0];
    if(!file || !targetPinInfo) return;
    const reader = new FileReader();
    reader.onload = function(evt){
      const pinKey = `${targetPinInfo.catKey}_${targetPinInfo.optId}`;
      customPins[pinKey] = evt.target.result;

      const currentSel = selections[targetPinInfo.catKey];
      if(currentSel && currentSel.id === targetPinInfo.optId){
        selectOption(targetPinInfo.catKey, targetPinInfo.optId, currentSel.label, evt.target.result);
      } else {
        renderOptions();
      }
      showToast('고정 사진이 지정되었습니다.');
    };
    reader.readAsDataURL(file);
    e.target.value = '';
  };

  // 저장 & 초기화
  document.getElementById('saveBtn').onclick = function(){
    const captureEl = document.getElementById('capture');
    html2canvas(captureEl, { scale: 2 }).then(canvas => {
      const link = document.createElement('a');
      link.download = '넨석_취향표.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    });
  };

  document.getElementById('resetBtn').onclick = function(){
    if(!confirm('작성 내용을 초기화하시겠습니까?')) return;
    CATEGORIES.forEach(cat => {
      delete selections[cat.key];
      const photoEl = document.getElementById(`photo-${cat.key}`);
      const captionEl = document.getElementById(`caption-${cat.key}`);
      photoEl.innerHTML = `<span class="empty-label">선택 없음</span>`;
      captionEl.textContent = '';
      captionEl.classList.add('placeholder');
    });
    renderOptions();
    showToast('초기화되었습니다.');
  };

  // 실행
  initGrid();
  initTabs();
  renderOptions();
})();
</script>
</body>
</html>
